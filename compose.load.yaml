services:
  api:
    ports: !reset []
    depends_on: !reset {}
    environment:
      QUEUE_DATABASE_URL: ""
      QUEUE_SQL_TIMING: "1"
      LOAD_BASE_URL: http://127.0.0.1:8000
    volumes:
      - ./load_test.py:/app/load_test.py:ro
      - ./chaos.py:/app/chaos.py:ro
  worker:
    environment:
      QUEUE_DATABASE_URL: ""
  db:
    profiles: [postgres]
  redis:
    profiles: [redis]
