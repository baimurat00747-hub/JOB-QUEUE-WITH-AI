name: queue-observability

services:
  loki:
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/queue-loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/queue-loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 3s
      timeout: 3s
      retries: 15

  alloy:
    image: grafana/alloy:v1.21.3
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - ${QUEUE_AGENT_LOG_DIR:-./.local/queue-agent}:/var/log/queue-agent:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${QUEUE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/loki.yaml:/etc/grafana/provisioning/datasources/queue-loki.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  loki-data:
  alloy-data:
  grafana-data:
